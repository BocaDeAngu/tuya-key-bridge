[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boca-tuya-bridge"
version = "0.1.0"
description = "Ponte NDJSON de localKeys Smart Life/Tuya via QR login (sem dev account) — reimplementação sobre o SDK oficial."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "tuya-device-sharing-sdk>=0.2.15",
    "qrcode[pil]>=7.4",
    "cryptography>=41",
]

[project.scripts]
boca-tuya-bridge = "boca_tuya_bridge:main"

[tool.setuptools]
py-modules = ["boca_tuya_bridge"]
